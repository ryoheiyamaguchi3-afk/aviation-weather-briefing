name: Daily aviation weather briefing
on:
  schedule:
    # UTC -> JST 04:17, 05:47, 16:17, 17:47. Second runs catch late updates.
    - cron: '17 7,19 * * *'
    - cron: '47 8,20 * * *'
  workflow_dispatch:
    inputs:
      retry_failed:
        description: 'Retry an interrupted/failed PDF once (may incur a second API charge)'
        required: false
        default: false
        type: boolean

# One durable writer across manual and scheduled runs.
concurrency:
  group: weather-briefing
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Discover latest source and reserve one API request
        id: prepare
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-4.1-mini' }}
          MAX_MONTHLY_REQUESTS: ${{ vars.MAX_MONTHLY_REQUESTS || '70' }}
          RETRY_FAILED: ${{ inputs.retry_failed }}
        run: |
          if [ "$RETRY_FAILED" = "true" ]; then
            python -m briefing.pipeline prepare --retry
          else
            python -m briefing.pipeline prepare
          fi
      - name: Persist reservation before any paid API call
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Record source check and analysis reservation'
            git push
          fi
      - name: Analyze PDF text and diagrams
        id: analyze
        if: steps.prepare.outcome == 'success'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_OUTPUT_TOKENS: ${{ vars.MAX_OUTPUT_TOKENS || '12000' }}
        run: python -m briefing.pipeline analyze
      - name: Persist validated reports and attempt results
        run: |
          git add data
          if ! git diff --cached --quiet; then
            git commit -m 'Save briefing result'
            git push
          fi
      - name: Build public files only
        run: python -m briefing.pipeline build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Flag failures after retaining last good report
        if: always()
        run: python scripts/check_health.py

  deploy:
    needs: generate
    # An unhealthy update can still deploy a visible error with the last good report.
    if: always() && needs.generate.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
